<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Термит</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main>
    <section class="hero">
        
      <img
        class="hero__top"
        src="assets/svg/top.svg"
        alt=""
      >

      <img
        class="hero__logo"
        src="assets/svg/logo.svg"
        alt="Термит"
      >
      <img
        class="hero__item hero__item--1"
        src="assets/images/img1.svg"
        alt="Целый дом в щепки"
      >

      <img
        class="hero__item hero__item--2"
        src="assets/images/img2.svg"
        alt="Обработка стен термитами"
      >

      <img
        class="hero__item hero__item--3"
        src="assets/images/img3.png"
        alt="Стилизация мебели"
      >

    </section>
    <section class="gallery-screen">

  <img class="gallery-screen__logo"
       src="assets/svg/logo2.svg"
       alt="">

  <img id="galleryImage"
       class="gallery-screen__image"
       src="assets/images/bigimg1.png"
       alt="">

  <img class="gallery-screen__small-logo"
       src="assets/svg/smalllogo.svg"
       alt="">

  <button id="galleryNext"
          class="gallery-screen__button"
          type="button">
    <img src="assets/svg/button.svg" alt="">
  </button>

</section>
<section class="transform-screen">

  <img
    class="transform-screen__logo"
    src="assets/svg/biglogosvg.svg"
    alt="Превратим всё в щепки"
  >

  <div class="transform-screen__cover-wrap">
    <img
      class="transform-screen__cover"
      src="assets/svg/topcover.svg"
      alt="Новый офис"
    >
  </div>

</section>
<footer class="footer-screen">

  <img
    class="footer-screen__pic"
    src="assets/images/footerpic.png"
    alt=""
  >

  <img
    class="footer-screen__text"
    src="assets/svg/footertext.svg"
    alt="Контакты и информация об авторах"
  >

</footer>

  </main>
<script src="js/script.js"></script>
</body>
</html>
